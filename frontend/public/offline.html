<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Amana</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #0b1120;
        color: #e2e8f0;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.02em;
        margin-bottom: 20px;
      }
      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 12px #38bdf8;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
        line-height: 1.5;
        font-size: 15px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        margin: 0 0 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0 0 24px;
        display: grid;
        gap: 8px;
      }
      li a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-radius: 10px;
        background: #1e293b;
        color: #e2e8f0;
        text-decoration: none;
        font-size: 15px;
        transition: background 0.15s ease;
      }
      li a:hover,
      li a:focus {
        background: #273449;
      }
      li a span.arrow {
        color: #38bdf8;
      }
      button {
        width: 100%;
        padding: 13px 16px;
        border: none;
        border-radius: 10px;
        background: #38bdf8;
        color: #0b1120;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover,
      button:focus {
        background: #7dd3fc;
      }
      .status {
        margin-top: 14px;
        font-size: 13px;
        color: #94a3b8;
        text-align: center;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="brand-dot"></span>Amana</div>
      <h1>You're offline</h1>
      <p>
        We can't reach the network right now. Some sections you've visited
        recently may still be available from your device cache.
      </p>

      <h2>Available cached sections</h2>
      <ul>
        <li><a href="/trades">View Cached Trades <span class="arrow">→</span></a></li>
        <li><a href="/wallet">Check Wallet <span class="arrow">→</span></a></li>
      </ul>

      <button type="button" id="retry">Try Reconnecting</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      (function () {
        var button = document.getElementById("retry");
        var status = document.getElementById("status");

        function updateStatus() {
          if (navigator.onLine) {
            status.textContent = "Connection restored. Reloading…";
            window.location.reload();
          } else {
            status.textContent = "Still offline. Check your connection and try again.";
          }
        }

        button.addEventListener("click", function () {
          status.textContent = "Checking connection…";
          if (navigator.onLine) {
            window.location.reload();
          } else {
            updateStatus();
          }
        });

        window.addEventListener("online", function () {
          status.textContent = "Connection restored. Reloading…";
          window.location.reload();
        });
      })();
    </script>
  </body>
</html>
